      <ellipse cx="256" cy="256" rx="160" ry="190"/>
      <!-- parallels -->
      <line x1="60" y1="256" x2="452" y2="256"/>
      <line x1="66" y1="161" x2="446" y2="161"/>
      <line x1="66" y1="351" x2="446" y2="351"/>
